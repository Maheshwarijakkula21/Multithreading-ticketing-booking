<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | Ticket Booking</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body class="auth-page"><main class="auth-card"><div class="brand-mark">TB</div><h1>Ticket Booking System</h1><p class="muted">Sign in to your account</p>
<form id="loginForm"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required placeholder="Enter username"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password"><button class="btn primary full" type="submit">Login →</button><p id="message" class="message" role="status"></p></form>
<p class="muted small">New customer? <a href="register.html">Create an account</a></p></main></body></html>
