<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | Ticket Booking</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body class="auth-page"><main class="auth-card"><div class="brand-mark">TB</div><h1>Create account</h1><p class="muted">Register as a customer</p>
<form id="registerForm"><label for="name">Full name</label><input id="name" name="name" required><label for="username">Username</label><input id="username" name="username" required autocomplete="username"><label for="password">Password (minimum 8 characters)</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password"><button class="btn primary full" type="submit">Create account</button><p id="message" class="message" role="status"></p></form><p class="muted small">Already registered? <a href="login.html">Login</a></p></main></body></html>
